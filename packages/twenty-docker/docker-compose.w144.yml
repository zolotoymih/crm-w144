# W144 production deploy compose for Twenty fork
# Used by Coolify on bti-smarttable VPS for crm.w144.com
#
# Image is pre-built in a Codespace and pushed to GHCR. Coolify pulls
# the published image — it does NOT build from source.
# To rebuild and republish:
#   1. cd /workspaces/crm-w144 (in Codespace)
#   2. docker login ghcr.io -u zolotoymih (use PAT with write:packages)
#   3. docker build --target twenty \
#        --build-arg REACT_APP_SERVER_BASE_URL=https://crm.w144.com \
#        -t ghcr.io/zolotoymih/crm-w144:latest \
#        -t ghcr.io/zolotoymih/crm-w144:$(git rev-parse --short HEAD) \
#        -f packages/twenty-docker/twenty/Dockerfile .
#   4. docker push ghcr.io/zolotoymih/crm-w144:latest
#   5. Coolify Redeploy (or push to feature branch — Auto Deploy enabled)
#
# External dependencies (NOT in this compose):
# - Postgres: separate Supabase project (set via PG_DATABASE_URL env)
# - Redis: Coolify-managed instance (set via REDIS_URL env)
# - TLS: Coolify Traefik handles cert provisioning + routing for crm.w144.com
#
# All sensitive values come from Coolify env vars at runtime.
# REACT_APP_SERVER_BASE_URL is baked into the frontend bundle at image
# build time (in step 3 above), not at compose-run time.

name: w144-twenty

services:
  server:
    image: ghcr.io/zolotoymih/crm-w144:latest
    pull_policy: always
    environment:
      NODE_ENV: production
      SERVER_URL: ${SERVER_URL:?SERVER_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required, generate with openssl rand -base64 32}
      PG_DATABASE_URL: ${PG_DATABASE_URL:?PG_DATABASE_URL is required (external Supabase Postgres)}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required (external Coolify Redis)}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required for SSO}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:?SUPABASE_JWT_ISSUER is required for SSO}
      SUPABASE_JWKS_URI: ${SUPABASE_JWKS_URI:?SUPABASE_JWKS_URI is required for SSO}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY is required for SSO}
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-true}
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: ${IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS:-true}
      SIGN_IN_PREFILLED: "false"
      STORAGE_TYPE: local
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    labels:
      - traefik.enable=true

      # Main router — apex CRM domain (crm.w144.com)
      - traefik.http.routers.twenty-main.rule=Host(`crm.w144.com`)
      - traefik.http.routers.twenty-main.entrypoints=https
      - traefik.http.routers.twenty-main.tls=true
      - traefik.http.routers.twenty-main.tls.certresolver=letsencrypt
      - traefik.http.routers.twenty-main.tls.domains[0].main=crm.w144.com
      - traefik.http.routers.twenty-main.tls.domains[0].sans=*.crm.w144.com
      - traefik.http.routers.twenty-main.service=twenty-server

      # Wildcard router — any subdomain of crm.w144.com (Twenty multi-workspace)
      - traefik.http.routers.twenty-wildcard.rule=HostRegexp(`^[a-z0-9-]+\.crm\.w144\.com$`)
      - traefik.http.routers.twenty-wildcard.entrypoints=https
      - traefik.http.routers.twenty-wildcard.tls=true
      - traefik.http.routers.twenty-wildcard.tls.certresolver=letsencrypt
      - traefik.http.routers.twenty-wildcard.tls.domains[0].main=crm.w144.com
      - traefik.http.routers.twenty-wildcard.tls.domains[0].sans=*.crm.w144.com
      - traefik.http.routers.twenty-wildcard.service=twenty-server

      # HTTP → HTTPS redirect for both routers
      - traefik.http.routers.twenty-main-http.rule=Host(`crm.w144.com`)
      - traefik.http.routers.twenty-main-http.entrypoints=http
      - traefik.http.routers.twenty-main-http.middlewares=redirect-to-https
      - traefik.http.routers.twenty-wildcard-http.rule=HostRegexp(`^[a-z0-9-]+\.crm\.w144\.com$`)
      - traefik.http.routers.twenty-wildcard-http.entrypoints=http
      - traefik.http.routers.twenty-wildcard-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https

      # Backend service definition — points to container's port 3000
      - traefik.http.services.twenty-server.loadbalancer.server.port=3000
    restart: unless-stopped

  worker:
    image: ghcr.io/zolotoymih/crm-w144:latest
    pull_policy: always
    command: ["yarn", "worker:prod"]
    environment:
      NODE_ENV: production
      SERVER_URL: ${SERVER_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_SECRET: ${APP_SECRET}
      PG_DATABASE_URL: ${PG_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER}
      SUPABASE_JWKS_URI: ${SUPABASE_JWKS_URI}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: local
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  server-local-data:
